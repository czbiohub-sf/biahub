# Unified estimate config for `biahub estimate-transform` (registration engine).
# Registration: the moving channel onto the reference channel at every timepoint
# (reference.frame: cross). Stabilization: drop reference.channel and set reference.frame to
# first or previous -- the moving channel aligned onto its own first / previous timepoint.
# Only the block of the chosen `method` is needed, named as the method (bead_matching,
# nuclei_matching, ants, phase_cross_corr, focus_finding, manual, shapes).
# `fallback` holds what used to be hidden constants: the adaptive flagging line, the
# repair candidates tried, in order, for flagged timepoints (then polished), and the
# optional parameter sweep, which competes with repair on the same flagged timepoints.
moving:
  channel: GFP EX488 EM525-45
reference:
  frame: cross   # cross: the reference channel at the same timepoint (registration);
                 # first / previous: the moving channel's own first / previous timepoint (stabilization)
  channel: Phase3D
method: bead_matching
bead_matching:
  algorithm: hungarian
  moving_peaks_settings:
    threshold_abs: 110.0
    nms_distance: 16
    min_distance: 0
    block_size:
    - 8
    - 8
    - 8
  reference_peaks_settings:
    threshold_abs: 0.8
    nms_distance: 16
    min_distance: 0
    block_size:
    - 8
    - 8
    - 8
  match_descriptor_settings:
    distance_metric: euclidean
    max_ratio: 0.8
    cross_check: true
  hungarian_match_settings:
    distance_metric: euclidean
    cost_threshold: 0.1
    max_ratio: 0.8
    cross_check: true
    edge_graph_settings:
      method: knn
      k: 5
      radius: null
    cost_matrix_settings:
      weights:
        dist: 0.5
        edge_angle: 1.0
        edge_length: 1.0
        pca_dir: 0.0
        pca_aniso: 0.0
        edge_descriptor: 0.0
      normalize: false
  spectral_match_settings:
    sigma: 3.0
    rel_cut: 0.5
    max_iter: 60
  spectral: 'off'
  estimation_mode: matching
  vote_icp_settings:
    vote_peaks_settings:
      threshold_abs: 200.0
      nms_distance: 8
      min_distance: 0
      block_size:
      - 16
      - 16
      - 16
    initial_capture_radius: 80.0
    min_capture_radius: 10.0
    radius_decay: 0.5
    cluster_radius: 10.0
    min_votes: 3
    max_iterations: 20
    convergence_translation: 0.5
  initial_transform_correction_settings:
    mode: none
    vote_peaks_settings:
      threshold_abs: 200.0
      nms_distance: 8
      min_distance: 0
      block_size:
      - 16
      - 16
      - 16
    capture_radius: 80.0
    cluster_radius: 10.0
    min_votes: 3
  filter_matches_settings:
    angle_threshold: 0.0
    direction_threshold: 0.0
    min_distance_quantile: 0.01
    max_distance_quantile: 0.99
  qc_settings:
    iterations: 1
    score_threshold: 0.4
    score_centroid_mask_radius: 6
# transform.type: what is fitted. transform.initial: where each estimate starts (left
# out: identity). from: matrix (this one, in `direction`), shapes (from the two stores'
# shapes and voxel sizes: rotate90, fliplr) or file (an earlier transforms file).
# propagate: true -- each timepoint starts from the previous one's result, the initial
# transform competing on the first pass (legacy use_prev_t_transform; one sequential job).
transform:
  type: affine
  initial:
    from: matrix
    matrix:
    - - 1
      - 0
      - 0
      - 0
    - - 0
      - 0
      - -1.288
      - 1960
    - - 0
      - 1.288
      - 0
      - -460
    - - 0.0
      - 0.0
      - 0.0
      - 1.0
    direction: inverse
time_indices: all
score:
  metric: overlap
fallback:
  flag:
    k_mad: 2.0
  repair:
    candidates:
    - t-1
    - t+1
    - consensus
    - initial
    consensus_min_good: 5
    max_timepoints: null
    polish_rounds: 3
  # Off unless given. Each sub-grid is a cross product of dotted paths into this config;
  # the trials are the union of the sub-grids. This is production's default bead_matching grid
  # (17 trials, about 1-2 min each per flagged timepoint).
  sweep: null
  # sweep:
  #   max_timepoints: 25
  #   grid:
  #   - bead_matching.hungarian_match_settings.cost_threshold: [0.05, 0.10]
  #     bead_matching.hungarian_match_settings.cost_matrix_settings.weights.dist: [0.25, 1.0]
  #     bead_matching.filter_matches_settings.max_distance_quantile: [0.95, 0.99]
  #   - bead_matching.algorithm: [spectral]
  #     bead_matching.spectral_match_settings.sigma: [1.0, 3.0, 5.0]
  #     bead_matching.spectral_match_settings.rel_cut: [0.35, 0.65, 0.80]
verbose: true
