# The dimensionality of the tracking. "2D" tracks a Z=1 input plate and writes a Z=1
# label image; "3D" tracks the stack and writes labels of the same Z. Track does NOT
# project or select Z-planes: a 3D input with output_mode 2D is an error. To track a
# projection, a window or one plane of a stack, make the Z=1 plate first with
# `biahub project` (settings/example_project_settings.yml) and track that.
output_mode: "2D"

fov: "*/*/*"
blank_frames_path: blank_frames.csv

# What feeds ultrack: "labels" (the default) tracks the instance labels of a label
# image of the -i plate, written by `biahub segment`
# (settings/example_segmentation_settings.yml); "foreground_contour" is the legacy
# path, which derives a foreground mask and contour map from input_images. Track does
# not segment: the cellpose settings live in the segment config.
segmentation_method: labels

# The label image to track, `labels/<labels>` in every -i position: the segment
# config's model name. The tracked labels are written next to it as
# `labels/tracks_<labels>`, with tracks.geff and a tracks CSV.
labels: nuclei
# Optional: another name for the tracked label image, to keep several tracking runs of
# one segmentation side by side. The tracks then go to tracks_<output_label>.geff and
# tracks_<output_label>_<fov>.csv rather than tracks.geff / tracks_<fov>.csv.
# output_label: tracks_nuclei_sigma3
# Smoothing (pixels) ultrack applies to the labels' contours before it builds its own
# segmentation hypotheses from them.
labels_sigma: 5.0

# Optional post-processing (ultrack filter_short_sibling_tracks): at a division where
# exactly one daughter lives N frames or fewer and does not divide again, drop that
# daughter and merge the other into the parent; a division whose two daughters are
# both that short is kept. Removes short false divisions. Off by default.
# min_sibling_length: 3

# The linker: ultrack (default; builds its own segmentation hypotheses from the labels'
# contours and links them, configured by tracking_config below), tracksdata (ILP),
# hoct (learned edge scores + ILP) or trackastra (transformer links). tracksdata, hoct
# and trackastra link the instance labels of `labels` as they are, so they need
# segmentation_method: labels and output_mode: 2D, and they write the tracked labels
# and the CSV but no tracks.geff yet. Distances are in um; the defaults below are the
# A549 benchmark's. hoct and trackastra also read the image the labels were segmented
# from: the first channel `biahub segment` recorded for the label image, or
# image_channel when set (needed for a label image segment did not write).
# The tracked labels are the final segmentation: downstream steps should prefer
# labels/tracks_<labels> over labels/<labels>. Only ultrack changes the masks (merging
# or splitting segments where that tracks better); the other three keep them as they are.
# tracker: ultrack
# tracksdata_config:
#   distance_threshold_um: 22.66   # candidate edges to the next frame
#   n_neighbors: 3
#   distance_norm_um: 11.33        # edge weight = -IoU * exp(distance / distance_norm_um)
#   node_weight: -2.0
#   appearance_weight: 5.0
#   disappearance_weight: 5.0
#   division_weight: 1.0
#   border_margin_um: 6.80         # appearing within this distance of the edge ...
#   border_appearance_weight: -1.0 # ... costs this instead of appearance_weight
# hoct_config:
#   model: general_v1              # HOCT registry name or a path to weights
#   image_channel: null            # default: the channel segment recorded
#   distance_threshold_um: 33.99
#   n_neighbors: 5
#   max_delta_t: 3                 # frames an edge may skip
#   solver: {}                     # HOCT ILPSolverConfig overrides
#   downsample: 1                  # shrink labels/image first (trained on ~11 px nuclei; A549: 6)
# trackastra_config:
#   model: general_2d              # pretrained name (general_2d, ctc) or a model folder
#   mode: greedy                   # greedy | greedy_nodiv | ilp
#   image_channel: null            # default: the channel segment recorded
#   downsample: 1                  # a fine-tuned model: the factor it was trained at

# ---------------------------------------------------------------------------
# Alternative: segmentation_method: foreground_contour (legacy)
# Replace `labels` / `labels_sigma` above with `target_channel` (the name of the label
# image the tracks are written to) and an input_images block whose processing functions
# produce the foreground mask and contour map:
#
# segmentation_method: foreground_contour
# target_channel: nuclei_prediction
#
# Input image configurations. Each entry defines one dataset (path) and the channels
# to load/process from it. Two input sources feed tracking:
#   * `-i` (input_position_dirpaths) defines the plate structure (positions, shape, scale).
#   * input_images[].path supplies the pixel data loaded per FOV.
# The FIRST entry with `path: null` is the primary data source: it resolves to
# `--input-images-path` if given (Nextflow), else to the `-i` input plate. Any LATER
# null entries are virtual/computed channels.
#
# input_images:
#   - path: null
#     channels:
#       nuclei_prediction:
#         - function: ultrack.imgproc.normalize
#           kwargs:
#             gamma: 0.7
#       membrane_prediction:
#         - function: ultrack.imgproc.normalize
#           kwargs:
#             gamma: 0.7
#
#   # Virtual channel computed dynamically from the prior outputs (path: null).
#   - path: null
#     channels:
#       foreground:
#         - function: ultrack.imgproc.detect_foreground
#           input_channels:
#             - nuclei_prediction
#           kwargs:
#             sigma: 90
#       contour:
#         - function: biahub.cli.track.mem_nuc_contour
#           input_channels:
#             - nuclei_prediction
#             - membrane_prediction
#           kwargs: {}
# ---------------------------------------------------------------------------

# Configuration for Ultrack tracking algorithm (used only when tracker: ultrack).
# See: https://royerlab.github.io/ultrack/

tracking_config:

  # Segmentation parameters: controls object detection from foreground/contour maps.
  segmentation_config:
    min_area: 2100            # Minimum object area (pixels)
    max_area: 80000           # Maximum object area (pixels)
    n_workers: 10             # Number of CPU threads for segmentation
    min_frontier: 0.4         # Minimum frontier strength for boundaries
    max_noise: 0.05           # Maximum tolerated noise in segmentation

  # Linking parameters: controls how detections are connected across timepoints.
  linking_config:
    n_workers: 10             # Number of CPU threads for linking
    max_distance: 15          # Max distance (in pixels) to link objects
    distance_weight: -0.0001  # Cost penalty per pixel of distance
    max_neighbors: 3          # Maximum number of neighbors to evaluate per object

  # Global tracking parameters: controls optimization across time.
  tracking_config:
    n_threads: 14             # Threads used for global tracking optimization
    disappear_weight: -0.0001  # Penalty for object disappearance
    appear_weight: -0.001      # Penalty for new object appearance
    division_weight: -0.0001   # Penalty (or reward) for cell division events
