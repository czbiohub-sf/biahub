# biahub track, tracker: tracksdata (ILP on the cellpose labels).
# Defaults: the A549 benchmark's full-movie run (not yet tuned). Distances in um.

output_mode: "2D"
fov: "*/*/*"
target_channel: nuclei_prediction

# Z: a 60-plane window around the Phase3D focus, mean-projected (input_images below).
z_slicing:
  method: focus
  window_size: 60
  focus_channel: Phase3D

# cellpose labels feed every tracker; tracksdata, hoct and trackastra link them as they are.
segmentation_method: cellpose
cellpose_config:
  pretrained_model: cpsam_v2
  diameter: 80
  cellprob_threshold: 0.0
  flow_threshold: 0.4
  gpu: true
  min_size: 2500
  input_channel: nuclei_prediction
  labels_sigma: 5.0

# Drop a daughter that lives 3 frames or fewer (VS hallucinations, neighbours).
min_sibling_length: 3

input_images:
  - path: null                     # null = the -i plate
    channels:
      nuclei_prediction:
        - function: np.mean
          kwargs:
            axis: 1
          per_timepoint: false
      Phase3D: []                  # loaded only for focus finding

tracker: tracksdata
tracksdata_config:
  distance_threshold_um: 22.66     # candidate edges to the next frame
  n_neighbors: 3
  distance_norm_um: 11.33          # edge weight = -IoU * exp(distance / distance_norm_um)
  node_weight: -2.0
  appearance_weight: 5.0
  disappearance_weight: 5.0
  division_weight: 1.0             # raise to allow more divisions
  border_margin_um: 6.80
  border_appearance_weight: -1.0
