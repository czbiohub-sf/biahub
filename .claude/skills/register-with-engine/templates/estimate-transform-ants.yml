# biahub estimate-transform -- ANTs (intensity-based) registration, for pairs without usable
# beads, e.g. fluorescence onto a virtual-staining prediction or phase. Set moving.channel and
# reference.channel. Fields to decide:
#   transform.type: similarity -- rotation, translation and one scale (e.g. two cameras of
#                                different magnification). euclidean is ANTs Rigid (no scale);
#                                affine can diverge in z on thin stacks (few z slices)
#   preprocess                -- what is done to the volumes before ANTs (empty: raw):
#                                clip_percentiles (outliers), sobel (match edges, not raw
#                                intensity: needed for cross-modal pairs), mask_circle /
#                                mask_box (compare only inside; e.g. a bright well edge)
#   score.preprocess: sobel   -- the score compares edges too; score.report adds metrics
#                                written next to it (raw pair), e.g. mutual_information
#   transform.initial         -- ANTs refines from it, so it decides which solution ANTs
#                                finds: left out (identity) when both channels share a camera
#                                grid, else {from: matrix, matrix: ..., direction: inverse}, an
#                                estimate of the offset and scale; {from: shapes, rotate90: -1,
#                                fliplr: false} builds it from the store shapes (the mantis
#                                light-sheet rotation; only for mantis data)
#   fallback.repair           -- for a single timepoint, set it to null: there is nothing to
#                                repair from, and each repair is another full ANTs run
# The score is a correlation: a correct transform often scores 0.1-0.3, below the bead-tuned
# fallback.flag thresholds, so `unreliable` here means "check", not "wrong"; check the result
# with overlays rather than the score (references/methods.md).
moving:
  channel: <moving channel>
reference:
  frame: cross
  channel: <reference channel>
preprocess:
- clip_percentiles:
    target:
    - moving
    - reference
    low: 1.0
    high: 99.5
- sobel:
    target:
    - moving
    - reference
method: ants
ants: {}
score:
  preprocess:
  - sobel:
      target:
      - moving
      - reference
  report:
  - mutual_information
transform:
  type: similarity
time_indices: all
fallback:
  flag:
    k_mad: 2.0
  repair:
    candidates:
    - t-1
    - t+1
    - consensus
    - initial
    consensus_min_good: 5
    max_timepoints: null
    polish_rounds: 3
verbose: true
