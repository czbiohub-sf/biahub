# biahub estimate-transform -- manual registration: pick matching points in napari on one
# timepoint (time_indices), applied to the whole series. Interactive: run it with the plain
# CLI (templates/run_estimate_transform.sh) in a session with a display, not through Nextflow;
# then apply its file, or refine it with ants: point the ants config's transform.initial at
# it, {from: file, file: <its transforms file>} (kept unless ants scores better).
#   manual.affine_90degree_rotation / affine_fliplr -- pre-orient the moving volume so the
#                                points are easy to find (mantis light-sheet: see the initial transform below)
#   transform.initial         -- shown as the starting overlay; the example is the mantis
#                                light-sheet -> label-free geometry (inverse direction)
moving:
  channel: <moving channel>
reference:
  frame: cross
  channel: <reference channel>
method: manual
manual:
  affine_90degree_rotation: 0
  affine_fliplr: false
transform:
  type: euclidean
  initial:
    from: matrix
    matrix:
    - - 1
      - 0
      - 0
      - 0
    - - 0
      - 0
      - -1.288
      - 1960
    - - 0
      - 1.288
      - 0
      - -460
    - - 0.0
      - 0.0
      - 0.0
      - 1.0
    direction: inverse
time_indices: 0
fallback:
  flag:
    k_mad: 2.0
  repair:
    candidates:
    - t-1
    - t+1
    - consensus
    - initial
    consensus_min_good: 5
    max_timepoints: null
    polish_rounds: 3
verbose: true
