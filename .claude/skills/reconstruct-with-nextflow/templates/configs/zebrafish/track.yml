# PLACEHOLDER — tracking is NOT part of the neuromast/zebrafish deliverable.
#
# The deliverable for this family is 5-assemble. Cell tracking is an A549 step;
# neuromast work uses its own downstream tooling.
#
# This file exists only because nextflow/mantis-v2.nf hard-requires
# --track_config and unconditionally wires track_wf after assemble — there is no
# way to skip a step today. Tracked in biahub#306 (make pipeline steps optional).
#
# So for a zebrafish run:
#   - pass this file to --track_config so the pipeline validates and starts;
#   - treat 5-assemble as the end of the run;
#   - 4-track output is a by-product. Discard it, and do not report it as a
#     deliverable.
#
# If you actually want neuromast tracking, do not start from this file — the
# parameters below are copied from the A549 config and are NOT tuned for
# neuromasts (cell diameter, areas, and linking distance all differ). Tune them
# deliberately and say so.
#
# CURRENT SCHEMA. TrackingSettings forbids extra keys; the old fields `mode`,
# `z_range` and `focus_config` are rejected. Mapping from the old schema:
#   mode                            -> output_mode
#   z_range + focus_config.z_window -> z_slicing.{method, window_size, focus_channel}

output_mode: "2D"
fov: "*/*/*"
target_channel: nuclei_prediction

# The old zebrafish configs used a 40-plane in-focus window
# (focus_config.z_window: 40), which maps to the block below.
z_slicing:
  method: focus
  window_size: 40
  focus_channel: Phase3D

segmentation_method: cellpose
cellpose_config:
  model_type: nuclei
  diameter: 80
  cellprob_threshold: 0.0
  flow_threshold: 0.4
  gpu: true
  min_size: 2500
  input_channel: nuclei_prediction
  labels_sigma: 5.0

input_images:
  - path: null
    channels:
      nuclei_prediction:
        - function: np.mean
          kwargs:
            axis: 1
          per_timepoint: false

tracking_config:
  segmentation_config:
    min_area: 2500
    max_area: 80000
    min_frontier: 0.5
    max_noise: 0.00
  linking_config:
    max_distance: 15
    distance_weight: -0.0001
    max_neighbors: 3
  tracking_config:
    disappear_weight: -0.0001
    appear_weight: -0.001
