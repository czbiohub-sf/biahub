[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "biahub"
description = "Bioimage analysis hub."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

dynamic = ["version"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "click",
  "iohub>=0.3.11",
  "matplotlib",
  "natsort",
  "numpy",
  "markdown",
  "pandas",
  "pydantic>2",
  "scipy",
  "submitit",
  "torch",
  "tqdm",
  "waveorder>=3.0.4",
  "largestinteriorrectangle",
  # 0.6 is the first antspyx with cp313 wheels; below it, Python 3.13 falls back
  # to building ANTs from source and fails. Every 0.6.x caps scipy<1.16, so this
  # floor is also what holds scipy on the 1.15 series -- without it the resolver
  # prefers newer scipy and silently drops antspyx back to a cp312-only 0.5.x.
  "antspyx>=0.6",
  "pystackreg",
  "imageio-ffmpeg",
  "dask[array]",
  "toml",
  "scikit-learn",
  "numba>=0.58.0",
  "llvmlite>=0.41.0",
  "humanize",
]

[project.optional-dependencies]
segment = ["cellpose>=4.0.1"]

# Deliberately CPU-only. ultrack has an optional GPU path when cupy and cucim
# are installed, but it offers no speedup in tracking in our use cases.
# geff-spec>=1.3 records related_objects[].node_prop, which links tracks.geff to
# the label image; geff-spec 1.1 silently drops it, and geff 1.3 itself only caps
# geff-spec (<1.4), so the floor has to be stated here.
track = ["ultrack>=0.8", "geff>=1.3", "geff-spec>=1.3"]

# PyQt6>=6.10 does not provide wheels
gui = ["napari[pyqt6]", "PyQt6<6.10", "napari-animation"]

stain = ["cytoland"]

# The external QC pipeline, whose `imaging-qc` CLI nextflow/qc-standalone.nf
# calls as a bare command. `interactive` brings plotly, which the report step
# needs unless it runs with --qc_report_static.
#
# Deliberately NOT in `all`: imaging-qc-pipeline is a private repo with no PyPI
# release, so resolving it needs credentials CI's `uv sync --group dev` does not
# have. Install it explicitly with `uv sync --extra qc`.
qc = ["imaging_qc_pipeline[interactive]"]

all = ["biahub[segment,track,gui,stain]"]

build = ["build", "twine"]

doc = [
    "zensical>=0.0.32",
    "mkdocs-click>=0.8",
]

[dependency-groups]
dev = [
  "biahub[all,build]",
  "pre-commit~=4.5",
  "pytest~=9.0",
  "ruff~=0.15",
]

[project.scripts]
biahub = "biahub.cli.main:cli"

[tool.uv]
# Needed so that uv considers pypi (and not only the pytorch CPU extra index)
# when resolving build-system requirements such as iohub's hatchling /
# uv-dynamic-versioning chain, which pulls in packaging>=24.2.
index-strategy = "unsafe-best-match"
# waveorder's own [tool.uv.sources] pins iohub to an older main commit
# (b7bc648, the czbiohub-sf/iohub#476 merge) than the one biahub needs below
# (the dev/pyramid-shards branch). uv refuses two git URLs for one package,
# so force the whole graph onto biahub's rev. Drop together with the iohub pin.
override-dependencies = [
  "iohub @ git+https://github.com/czbiohub-sf/iohub@29b9d8b560e02eefe5636e2bf89b6153bea65847",
]

[tool.uv.sources]
# Private repo, no PyPI release. HTTPS rather than ssh so that installing the
# `qc` extra needs no SSH key: an org member authenticates once with the GitHub
# CLI, which is already on Bruno, and uv picks the credential up through git.
#
#     gh auth login        # browser/device-code flow, SSO-aware
#     gh auth setup-git    # installs gh as git's credential helper
#
# Anyone who prefers ssh keeps working with a local rewrite, so this costs the
# key-holders nothing:
#
#     git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"
#
# Pinned at v0.6.0: metric `granularity:` is `split_by:` and gate
# `granularity: channel` is `per_channel: true`; the old spellings exit 2.
# v0.6.0 includes #243 (instance_count reads a label image inside the intensity
# store, `label:`, which counts the labels track writes into the projected plate)
# and #235, which removed the `upstream_qc_dir` config key.
imaging_qc_pipeline = { git = "https://github.com/czbiohub-sf/imaging-qc-pipeline", tag = "v0.6.0" }

# Pin ultrack to royerlab/ultrack main at the #289 merge. #288 gives
# Tracker.to_geff track_id/lineage_id/seg_id node props, related_objects pointing
# at the label image, axes with units and scale (no z in 2D),
# include_masks/include_overlaps and zarr_format=3, so track can write
# tracks.geff inside the OME-NGFF 0.5 plate it reads (#361); #289 stops
# create_zarr from leaking its temporary stores. Neither is in a PyPI release
# yet (0.8.0 predates both, and main's __version__ still reads 0.7.3, which this
# git pin overrides).
#
# Pinned to the ieivanov fork at royerlab/ultrack#290 (on top of that main):
# `to_geff(tracks_df=...)` exports the GEFF from the same tracks table the labels
# are painted from, so tracks.geff, the labels and the CSV agree after
# `filter_short_sibling_tracks` (track's min_sibling_length). Repoint at
# royerlab/ultrack main once #290 merges, and at a release once one contains them.
ultrack = { git = "https://github.com/ieivanov/ultrack", rev = "69e7589a050b0aa5f84ccda3bdf072f5289f939c" }

# Pin iohub to dev/pyramid-shards, a combination branch of three open PRs (one
# installable revision while they are reviewed; see each PR for the feature):
#   #488 feat/label-pyramid: PositionLabel.compute_pyramid, with which `biahub
#        pyramid` gives the label images the same levels as the image (#359), and
#        a fix for the "mode" downsampler;
#   #461 feat/auto-size-shards (on #488): `shards=` / `label_shards=` as a size
#        target, extent or shape, and pyramid levels whose shards keep the level-0
#        shard's byte size;
#   #491 feat/pyramid-resume (on #461): compute_pyramid(resume=, resume_token=),
#        one shard-aligned region per unit, with which `biahub pyramid --resume`
#        recomputes only what an interrupted attempt did not finish;
#   #489 feat/process-single-position-output-label: process_single_position(
#        output_label=...), with which `biahub segment` writes its labels into the
#        plate's label images with --resume, and create_empty_labels, with which
#        segment --init and track --init scaffold those label images.
# Main's #486 adds create_empty_plate(label_names=...) (#360), and #485 puts the
# labels list on <fov>/labels/zarr.json so ome-zarr-models and dca-validate can
# open a field that has labels. Repoint at main as they merge (#489, #488, then
# #461 rebased), and at a PyPI release once one contains them.
#
# Main's own reasons: #476 syncs a write unit's shards before recording it as
# done (without it a preemption between the write and the marker leaves a `.done`
# beside a shard whose bytes never landed, which silently cost several runs on
# 2026_08_14_dynatrack); #472 adds create_empty_plate(extra_metadata=...); #479
# creates a plate's positions in one batch instead of rewriting the well's
# metadata per position (hours for a ~40k-FOV plate's init).
iohub = { git = "https://github.com/czbiohub-sf/iohub", rev = "29b9d8b560e02eefe5636e2bf89b6153bea65847" }

# Pin waveorder to the main commit that merged mehta-lab/waveorder#583, which
# runs apply-inv-tf through iohub's process_single_position with resume (on top
# of mehta-lab/waveorder#582, which shares one transfer function across
# workers). `biahub apply-inv-tf --resume` passes resume= through to it. Drop
# this back to a PyPI floor once waveorder cuts a release containing both.
waveorder = { git = "https://github.com/mehta-lab/waveorder", rev = "8d796509b88bafc46a31b81889f6b8034a9050db" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["biahub"]

[tool.ruff]
line-length = 95
target-version = "py312"

# .claude holds skill prompts whose fenced code blocks are deliberately
# incomplete templates; ruff >=0.16 formats Markdown and would rewrite them.
exclude = ["archive", "examples", "scripts", "notebooks", ".claude"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "D"]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "N802",  # Function name should be lowercase (scientific code uses uppercase)
    "N803",  # Argument name should be lowercase (scientific code uses uppercase)
    "N806",  # Variable in function should be lowercase (scientific code uses uppercase)
    "N815",  # Variable in class scope should not be mixedCase
    "N999",  # Invalid module name (vendored BeadExtractor.py)
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
lines-between-types = 1
known-first-party = ["biahub"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
filterwarnings = [
    # higra (transitive via ultrack) ships math docstrings with unescaped
    # backslashes, which Python >=3.12 flags as SyntaxWarning on import. Not
    # fixable on our end (0.6.13 is the latest release); silence the noise.
    "ignore:invalid escape sequence:SyntaxWarning",
]
