[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "biahub"
description = "Bioimage analysis hub."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

dynamic = ["version"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "click",
  "iohub>=0.3.8",
  "matplotlib",
  "natsort",
  "numpy",
  "markdown",
  "monai",
  "pandas",
  "pydantic>2",
  "scipy",
  "submitit",
  "torch",
  "tqdm",
  "waveorder>=3.0.4",
  "largestinteriorrectangle",
  "antspyx",
  "pystackreg",
  "imageio-ffmpeg",
  "dask[array]",
  "toml",
  "scikit-learn",
  "numba>=0.58.0",
  "llvmlite>=0.41.0",
  "humanize",
]

[project.optional-dependencies]
segment = ["cellpose"]

track = ["ultrack>=0.7"]

# PyQt6>=6.10 does not provide wheels
gui = ["napari[pyqt6]", "PyQt6<6.10", "napari-animation"]

stain = ["cytoland"]

all = ["biahub[segment,track,gui,stain]"]

build = ["build", "twine"]

doc = [
    "zensical>=0.0.32",
    "mkdocs-click>=0.8",
]

[dependency-groups]
dev = [
  "biahub[all,build]",
  "pre-commit~=4.5",
  "pytest~=9.0",
  "ruff~=0.15",
]

[project.scripts]
biahub = "biahub.cli.main:cli"

[tool.uv]
# zarr 3.3.0 regressed chunk normalization: normalize_chunks_1d narrows with
# `isinstance(chunks, int)` while its caller normalize_chunks_nd uses
# numbers.Integral, so a numpy integer chunk size falls through to a
# `list(chunks)` branch and raises "'numpy.int64' object is not iterable".
# ultrack's large_chunk_size returns np.int64 for the spatial dims, which
# breaks every array_apply call in biahub track. Repro:
#   zarr.zeros((4, 4), dtype="f4", chunks=(np.int64(2), np.int64(2)))
# Drop this cap once zarr ships the fix.
constraint-dependencies = ["zarr<3.3"]

# Needed so that uv considers pypi (and not only the pytorch CPU extra index)
# when resolving build-system requirements such as iohub's hatchling /
# uv-dynamic-versioning chain, which pulls in packaging>=24.2.
index-strategy = "unsafe-best-match"

[tool.uv.sources]
# Pin cytoland to the commit from VisCy PR #465 (non-square TTA and helpers).
# Revert to the PyPI release once that PR is merged and published.
cytoland = { git = "https://github.com/mehta-lab/VisCy", subdirectory = "applications/cytoland", rev = "4b62365c0df25929bffc7f01b3bb2d1c11d69cce" }
# Pin iohub to czbiohub-sf/iohub main, which now carries the two features this
# pipeline needs — both merged, but after the v0.3.10 release:
#   #455  replaces a shard torn by a preempted job instead of reading it back
#     (the recurring "checksum is invalid" abort) and adds the per-unit resume
#     this branch drives via --resume. Note the resume records sit BESIDE the
#     store, in a `.iohub-progress/` sibling of the output zarr, so copying or
#     deleting a store no longer carries or clears its progress state.
#   #454  adds create_empty_plate's metadata_keys, so a step copies only the
#     provenance zattrs it wants instead of every non-OME key (see
#     PROVENANCE_METADATA_KEYS).
# Drop this source and raise the iohub floor once a release includes both.
iohub = { git = "https://github.com/czbiohub-sf/iohub", rev = "f3c40a4abfda790cf915fd9ccb04ca98fbf15925" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["biahub"]

[tool.ruff]
line-length = 95
target-version = "py312"

# .claude holds skill prompts whose fenced code blocks are deliberately
# incomplete templates; ruff >=0.16 formats Markdown and would rewrite them.
exclude = ["archive", "examples", "scripts", "notebooks", ".claude"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "D"]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "N802",  # Function name should be lowercase (scientific code uses uppercase)
    "N803",  # Argument name should be lowercase (scientific code uses uppercase)
    "N806",  # Variable in function should be lowercase (scientific code uses uppercase)
    "N815",  # Variable in class scope should not be mixedCase
    "N999",  # Invalid module name (vendored BeadExtractor.py)
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
lines-between-types = 1
known-first-party = ["biahub"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
filterwarnings = [
    # higra (transitive via ultrack) ships math docstrings with unescaped
    # backslashes, which Python >=3.12 flags as SyntaxWarning on import. Not
    # fixable on our end (0.6.13 is the latest release); silence the noise.
    "ignore:invalid escape sequence:SyntaxWarning",
]
