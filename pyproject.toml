[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "biahub"
description = "Bioimage analysis hub."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

dynamic = ["version"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "click",
  "iohub>=0.3.11",
  "matplotlib",
  "natsort",
  "numpy",
  "markdown",
  "monai",
  "pandas",
  "pydantic>2",
  "scipy",
  "submitit",
  "torch",
  "tqdm",
  "waveorder>=3.0.4",
  "largestinteriorrectangle",
  # 0.6 is the first antspyx with cp313 wheels; below it, Python 3.13 falls back
  # to building ANTs from source and fails. Every 0.6.x caps scipy<1.16, so this
  # floor is also what holds scipy on the 1.15 series -- without it the resolver
  # prefers newer scipy and silently drops antspyx back to a cp312-only 0.5.x.
  "antspyx>=0.6",
  "pystackreg",
  "imageio-ffmpeg",
  "dask[array]",
  "toml",
  "scikit-learn",
  "numba>=0.58.0",
  "llvmlite>=0.41.0",
  "humanize",
]

[project.optional-dependencies]
segment = ["cellpose"]

# Deliberately CPU-only. ultrack has an optional GPU path when cupy and cucim
# are installed, but it offers no speedup in tracking in our use cases.
track = ["ultrack>=0.8"]

# PyQt6>=6.10 does not provide wheels
gui = ["napari[pyqt6]", "PyQt6<6.10", "napari-animation"]

stain = ["cytoland==0.1.0a0"]

# The external QC pipeline, whose `imaging-qc` CLI nextflow/qc-standalone.nf
# calls as a bare command. `interactive` brings plotly, which the report step
# needs unless it runs with --qc_report_static.
#
# Deliberately NOT in `all`: imaging-qc-pipeline is a private repo with no PyPI
# release, so resolving it needs credentials CI's `uv sync --group dev` does not
# have. Install it explicitly with `uv sync --extra qc`.
qc = ["imaging_qc_pipeline[interactive]"]

all = ["biahub[segment,track,gui,stain]"]

build = ["build", "twine"]

doc = [
    "zensical>=0.0.32",
    "mkdocs-click>=0.8",
]

[dependency-groups]
dev = [
  "biahub[all,build]",
  "pre-commit~=4.5",
  "pytest~=9.0",
  "ruff~=0.15",
]

[project.scripts]
biahub = "biahub.cli.main:cli"

[tool.uv]
# Needed so that uv considers pypi (and not only the pytorch CPU extra index)
# when resolving build-system requirements such as iohub's hatchling /
# uv-dynamic-versioning chain, which pulls in packaging>=24.2.
index-strategy = "unsafe-best-match"

[tool.uv.sources]
# Private repo, no PyPI release; ssh is the protocol a Biohub checkout is already
# authenticated for. The rev is the merge commit of imaging-qc-pipeline#199,
# which relaxed that project's `iohub==0.3.2` to a floor so both can share one
# environment — biahub needs iohub>=0.3.11 for the gapped-shard-write fix.
#
# cytoland used to sit here too; #323 moved it to a PyPI pin in the `stain`
# extra, so imaging_qc_pipeline is the only source left.
imaging_qc_pipeline = { git = "ssh://git@github.com/czbiohub-sf/imaging-qc-pipeline", rev = "062f3b3402cc4fdd46b14b8585744ceab84c1fc7" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["biahub"]

[tool.ruff]
line-length = 95
target-version = "py312"

# .claude holds skill prompts whose fenced code blocks are deliberately
# incomplete templates; ruff >=0.16 formats Markdown and would rewrite them.
exclude = ["archive", "examples", "scripts", "notebooks", ".claude"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "D"]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "N802",  # Function name should be lowercase (scientific code uses uppercase)
    "N803",  # Argument name should be lowercase (scientific code uses uppercase)
    "N806",  # Variable in function should be lowercase (scientific code uses uppercase)
    "N815",  # Variable in class scope should not be mixedCase
    "N999",  # Invalid module name (vendored BeadExtractor.py)
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
lines-between-types = 1
known-first-party = ["biahub"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
filterwarnings = [
    # higra (transitive via ultrack) ships math docstrings with unescaped
    # backslashes, which Python >=3.12 flags as SyntaxWarning on import. Not
    # fixable on our end (0.6.13 is the latest release); silence the noise.
    "ignore:invalid escape sequence:SyntaxWarning",
]
