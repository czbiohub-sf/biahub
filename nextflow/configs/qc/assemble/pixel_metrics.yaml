defaults:
  - base
  - _self_

# ONE DIRECTORY PER PIPELINE STEP, and that is what makes the report correct.
# `imaging-qc report` resolves a tab's report settings by scanning the directory
# it is given and taking the first YAML with a `report:` section. Point every tab
# at one shared directory and they all resolve to the same block — the stage-6 tab
# silently rendered THIS file's block: no instance_count plot, and pixel metric
# labels in a cell-count tab, at exit 0. A directory holding only the step's own
# configs cannot do that.
#
# So the grouping is by STEP (`assemble/`, `track/`), not by stage number. The
# `stage:` key below is the only place the number appears; renumbering a stage is
# that one edit, with no files to rename.
#
# Note for future edits: a `report:` block added to THIS file would lose to
# base.yaml's, because the scan prefers names containing "base"/"common" over
# everything else. Put report changes for this step in base.yaml.

# Pixel-value QC for an assembled (post-assembly) intensity store — the
# `<name>_imaging.zarr` holding the raw acquired channels. Inherits the metric
# set from `base.yaml` (intensity_stats, signal_to_noise, blank, tenengrad) and
# applies it across all channels.

stage: 5
display_name: "Assembled Image — Pixel QC"

# Per-channel SNR floors override `base.yaml`'s single scalar. Brightfield SNR is not
# comparable to fluorescence, so "BF - Oblique" is left out of the mapping (an
# unlisted channel gets no hard floor). The fluorescence values below are STARTING
# POINTS keyed to this store's channel names, NOT constants calibrated from any
# dataset — set each from the channel's healthy SNR for the experiment at hand.
signal_to_noise:
  granularity: slice
  gate:
    # `granularity: channel` evaluates the gate per channel, which is what lets the
    # {channel: value} hard_floor key by name (a channel-pooled gate has no channel
    # to key by and refuses the mapping).
    granularity: channel
    hard_floor:
      "raw GFP EX488 EM525-45": 5.0
      "raw mCherry EX561 EM600-37": 5.0
    hard_ceiling: null
    outlier_method: zscore
    outlier_params:
      n_std: 3.0
      tail: lower
