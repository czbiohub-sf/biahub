# Assemble step: concatenate deskew + reconstruct + virtual-stain channel-wise
# into one multichannel plate.
#
# Parameters only. The source stores are passed on the command line, one `-i`
# per store (the assemble subworkflow does this), so there is no
# concat_data_paths here. `channel_names: all` takes every channel of every
# source; to pick channels, give one entry per source in `-i` order, e.g.
# [all, [Phase3D], all].
time_indices: all
channel_names: all
chunks_czyx: null
output_ome_zarr_version: "0.5"

# shards_ratio is a ratio over the CHUNK shape (shards = chunks * ratio,
# elementwise TCZYX), not an absolute shard shape. Leave unset unless you have a
# measured reason: raising the T entry multiplies the shard buffer and the RAM
# request, and one torn shard then loses every timepoint in it.
# shards_ratio: [1, 1, 6, 7, 5]
