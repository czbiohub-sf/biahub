# Assemble step: concatenate deskew + reconstruct + virtual-stain channel-wise
# into one multichannel plate.
#
# Parameters only. The source stores are passed on the command line, one `-i`
# per store (the assemble subworkflow does this), so there is no
# concat_data_paths here. `channel_names: all` takes every channel of every
# source; to pick channels, give one entry per source in `-i` order, e.g.
# [all, [Phase3D], all].
#
# `time_indices: all` requires every position of every source to have the
# same number of time points and errors otherwise. To crop on purpose, use
# a range: {start: 0, stop: <T>} (stop exclusive), with an optional step, or
# `min` for the shortest; `max` keeps the longest and pads the rest with zeros.
# A range past the end of the shorter positions pads them the same way.
time_indices: all
channel_names: all
chunks_czyx: [1, 16, 256, 256]
output_ome_zarr_version: "0.5"

# shards is a size target: iohub builds the largest chunk-aligned shard under it,
# filling X, Y, Z first and then timepoints (C is never sharded). 5GB on a
# 171 x 768 x 794 float32 volume gives shards of 9 timepoints by the full volume
# (4.98 GB; the old 10-timepoint shards were 5.2 GiB, above the DCA 5 GB SHOULD).
# Do not raise it without a measured reason: the T extent multiplies the shard
# buffer and the RAM request, and one torn shard loses every timepoint in it.
# Also accepts "XY" / "XYZ" (one shard per plane / volume) or a TCZYX shape.
shards: 5GB
