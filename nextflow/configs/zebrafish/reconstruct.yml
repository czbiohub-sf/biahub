# input_channel_names must match the brightfield channel name in the DESKEWED
# store exactly — a mismatch fails at compute_transfer_function, after
# flat-field and deskew have already run.
input_channel_names: ["BF"]
time_indices: "all"
reconstruction_dimension: 3
phase:
  transfer_function:
    # Pixel sizes of the DESKEWED store, derived from deskew.yml. waveorder does
    # not read them from the zarr: omitted, they silently default to 0.1 / 0.25.
    #   yx_pixel_size = pixel_size_um
    #   z_pixel_size  = average_n_slices * sin(ls_angle_deg) * pixel_size_um
    yx_pixel_size: 0.1133
    z_pixel_size: 0.17
    wavelength_illumination: 0.532
    z_padding: 5
    index_of_refraction_media: 1.4
    numerical_aperture_detection: 1.35
    numerical_aperture_illumination: 0.52
    invert_phase_contrast: false
  apply_inverse:
    reconstruction_algorithm: Tikhonov
    regularization_strength: 0.01
    TV_rho_strength: 0.001
    TV_iterations: 1
