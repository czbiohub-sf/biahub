# Tracking config for the mantis-v2 pipeline (`biahub track`). A549.
#
# Track reads the ASSEMBLED plate (<N>-assemble/<dataset>.zarr), so target_channel
# and cellpose_config.input_channel must name channels that exist THERE. If you
# rename channels before tracking, update these to match.
#
# CURRENT SCHEMA. TrackingSettings forbids extra keys; the old fields `mode`,
# `z_range` and `focus_config` are rejected. Mapping from the old schema:
#   mode                            -> output_mode
#   z_range + focus_config.z_window -> z_slicing.{method, window_size, focus_channel}
# focus_config's NA_det / lambda_ill / pixel_size have no equivalent — focus
# detection now runs waveorder's focus_from_transverse_band on
# z_slicing.focus_channel internally.

# 2D writes an output plate with Z=1; input_images below projects Z with np.mean.
output_mode: "2D"
fov: "*/*/*"
target_channel: nuclei_prediction

# Segment a window of 60 planes around the in-focus plane rather than all planes:
# focus is found on the phase channel (median over timepoints), and the window is
# split 1/3 below / 2/3 above it (frac_below default). input_images below mean-
# projects the virtual-stain nuclei over that window. Against TrackEdit annotations
# (with min_sibling_length 3): division F1 0.63 -> 0.68 on 2026_04_28, with fewer
# false divisions and fragmented tracks on 2026_04_21 at the same mitotic-cell
# detection as all planes (0.95). A narrower 40-plane window lost mitotic cells
# that drift in Z (0.89).
z_slicing:
  method: focus
  window_size: 60
  focus_channel: Phase3D

segmentation_method: cellpose

# Sibling filter (ultrack filter_short_sibling_tracks, same meaning): at a division
# where exactly one daughter lives 3 frames or fewer and does not divide again, drop
# that daughter and merge the other into the parent; a division whose two daughters
# are both that short is kept. Most false divisions in the A549 benchmark against
# TrackEdit annotations were 1-2-frame "daughters" (virtual-staining hallucinations,
# a neighbour linked as a daughter). Division F1 rose by ~0.08-0.10 in the benchmark,
# and from 0.58 to 0.63-0.64 with this config on the annotated 2026_04_28 FOVs.
# Remove the line to keep every division.
min_sibling_length: 3
cellpose_config:
  pretrained_model: cpsam_v2
  diameter: 80
  cellprob_threshold: 0.0
  flow_threshold: 0.4
  gpu: true
  min_size: 2500
  input_channel: nuclei_prediction
  labels_sigma: 5.0

input_images:
  - path: null
    channels:
      nuclei_prediction:
        - function: np.mean
          kwargs:
            axis: 1
          per_timepoint: false
      # Loaded only for focus finding (z_slicing.focus_channel); not processed.
      Phase3D: []

tracking_config:
  segmentation_config:
    min_area: 2500
    max_area: 80000
    min_frontier: 0.5
    max_noise: 0.00
  linking_config:
    max_distance: 15
    distance_weight: -0.0001
    max_neighbors: 3
  tracking_config:
    disappear_weight: -0.0001
    appear_weight: -0.001
    division_weight: -0.0001
    bias: 0.0001
