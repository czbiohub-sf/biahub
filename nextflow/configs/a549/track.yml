# Tracking config for the mantis-v2 pipeline (`biahub track`). A549.
#
# Track reads the PROJECTED plate (<N>-assemble/<dataset>_proj.zarr, Z=1), so target_channel
# and cellpose_config.input_channel must name channels that `biahub project` wrote
# (project.yml's `channels`). If you rename channels before tracking, update these.
#
# CURRENT SCHEMA. TrackingSettings forbids extra keys; the old fields `mode`,
# `z_range`, `focus_config` and `z_slicing` are rejected. Z-plane selection and
# projection moved to `biahub project` (project.yml): the 60-plane focus window and
# the mean projection that used to be here live there now. Mapping from the old schema:
#   mode                              -> output_mode
#   z_slicing / z_range / focus_config -> project.yml: channels.<name>.z, focus
#   input_images np.mean step          -> project.yml: channels.<name>.method: mean

# 2D tracks the Z=1 projected plate and writes a Z=1 label plate. Track does not
# project; a 3D input with output_mode 2D is an error.
output_mode: "2D"
fov: "*/*/*"
target_channel: nuclei_prediction

segmentation_method: cellpose

# Sibling filter (ultrack filter_short_sibling_tracks, same meaning): at a division
# where exactly one daughter lives 3 frames or fewer and does not divide again, drop
# that daughter and merge the other into the parent; a division whose two daughters
# are both that short is kept. Most false divisions in the A549 benchmark against
# TrackEdit annotations were 1-2-frame "daughters" (virtual-staining hallucinations,
# a neighbour linked as a daughter). Division F1 rose by ~0.08-0.10 in the benchmark,
# and from 0.58 to 0.63-0.64 with this config on the annotated 2026_04_28 FOVs.
# Remove the line to keep every division.
min_sibling_length: 3
cellpose_config:
  pretrained_model: cpsam_v2
  diameter: 80
  cellprob_threshold: 0.0
  flow_threshold: 0.4
  gpu: true
  min_size: 2500
  input_channel: nuclei_prediction
  labels_sigma: 5.0

# The projected plate holds the nuclei already reduced to one plane; nothing to process.
input_images:
  - path: null
    channels:
      nuclei_prediction: []

tracking_config:
  segmentation_config:
    min_area: 2500
    max_area: 80000
    min_frontier: 0.5
    max_noise: 0.00
  linking_config:
    max_distance: 15
    distance_weight: -0.0001
    max_neighbors: 3
  tracking_config:
    disappear_weight: -0.0001
    appear_weight: -0.001
    division_weight: -0.0001
    bias: 0.0001
