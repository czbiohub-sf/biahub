# Tracking config for the mantis-v2 pipeline (`biahub track`). A549.
#
# Track reads the PROJECTED plate (<N>-assemble/<dataset>_proj.zarr, Z=1) and the label
# image `biahub segment` (segment.yml) wrote into it, `labels/<labels>`; it writes the
# tracked labels next to it as `labels/tracks_<labels>`, plus tracks.geff and a tracks
# CSV, into every position. Track neither segments nor projects.
#
# CURRENT SCHEMA. TrackingSettings forbids extra keys; the old fields `mode`,
# `z_range`, `focus_config`, `z_slicing` and `cellpose_config` are rejected. Mapping
# from the old schema:
#   mode                              -> output_mode
#   z_slicing / z_range / focus_config -> project.yml: channels.<name>.z, focus
#   input_images np.mean step          -> project.yml: channels.<name>.method: mean
#   cellpose_config (model, diameter, thresholds, min_size, input_channel)
#                                      -> segment.yml: models.<name>
#   cellpose_config.labels_sigma       -> labels_sigma
#   target_channel                     -> labels (the segment.yml model name); the
#                                         output is named tracks_<labels>

# 2D tracks the Z=1 projected plate and writes a Z=1 label image. Track does not
# project; a 3D input with output_mode 2D is an error.
output_mode: "2D"
fov: "*/*/*"

# The label image to track: segment.yml's model name. Tracks go to labels/tracks_nuclei.
labels: nuclei
# Smoothing (px) of the labels' contours before ultrack builds its own segmentation
# hypotheses from them.
labels_sigma: 5.0

# Sibling filter (ultrack filter_short_sibling_tracks, same meaning): at a division
# where exactly one daughter lives 3 frames or fewer and does not divide again, drop
# that daughter and merge the other into the parent; a division whose two daughters
# are both that short is kept. Most false divisions in the A549 benchmark against
# TrackEdit annotations were 1-2-frame "daughters" (virtual-staining hallucinations,
# a neighbour linked as a daughter). Division F1 rose by ~0.08-0.10 in the benchmark,
# and from 0.58 to 0.63-0.64 with this config on the annotated 2026_04_28 FOVs.
# Remove the line to keep every division.
min_sibling_length: 3

tracking_config:
  segmentation_config:
    min_area: 2500
    max_area: 80000
    min_frontier: 0.5
    max_noise: 0.00
  linking_config:
    max_distance: 15
    distance_weight: -0.0001
    max_neighbors: 3
  tracking_config:
    disappear_weight: -0.0001
    appear_weight: -0.001
    division_weight: -0.0001
    bias: 0.0001
