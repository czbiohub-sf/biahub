# Segmentation config for the mantis-v2 pipeline (`biahub segment`). A549.
#
# Segment reads the PROJECTED plate (<N>-assemble/<dataset>_proj.zarr, Z=1) and writes
# one label image per model INTO it, `labels/<model>` in every position, which is what
# `biahub track` reads (track.yml: `labels: nuclei`). Segment does not project: a model
# without eval_args.do_3D segments in 2D and needs a Z=1 input, which `biahub project`
# (project.yml) makes from the assembled plate. Channel names are the PRE-rename names
# of the assembled plate, which the projected plate inherits.
#
# Cellpose runs at native resolution (`diameter: null`). Cellpose 4 resizes each frame by
# 30 / diameter before inference, so the earlier diameter 80 ran at 37.5 % of native
# resolution and lost small, dim daughter nuclei right after a division. Against the
# TrackEdit divisions (track.yml unchanged, min_sibling_length 3), division F1 rose
# 0.68 -> 0.71 on 2026_04_28 (v2), 0.47 -> 0.52 on 2025_07_24 and 0.41 -> 0.55 on
# 2025_08_26 (v1), mostly from recall (25 of the 69 divisions diameter 80 missed);
# mitotic-cell detection on 2026_04_21 rose 0.95 -> 0.99. min_size 300 px drops cellpose
# fragments; ultrack's min_area (track.yml) still sets the smallest tracked object.
models:
  nuclei:
    pretrained_model: cpsam_v2      # cellpose 4: cpsam_v2, cpsam, cpdino, cpdino-vitb, or a path
    channels: [nuclei_prediction]   # projected-plate channel name(s), at most 3
    eval_args:
      diameter: null                # native resolution (no 30 / diameter resize)
      cellprob_threshold: 0.0
      flow_threshold: 0.4
      min_size: 300                 # px at native resolution
