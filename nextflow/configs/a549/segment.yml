# Segmentation config for the mantis-v2 pipeline (`biahub segment`). A549.
#
# Segment reads the PROJECTED plate (<N>-assemble/<dataset>_proj.zarr, Z=1) and writes
# one label image per model INTO it, `labels/<model>` in every position, which is what
# `biahub track` reads (track.yml: `labels: nuclei`). Segment does not project: a model
# without eval_args.do_3D segments in 2D and needs a Z=1 input, which `biahub project`
# (project.yml) makes from the assembled plate. Channel names are the PRE-rename names
# of the assembled plate, which the projected plate inherits.
#
# The cellpose settings are the ones tracking ran with when it still segmented itself
# (cpsam_v2, diameter 80, min_size 2500): validated on the 2026_04_28 annotated FOVs and
# reproduced position by position on the 2026_08_11 v8 debug reconstruction. Cellpose 4
# resizes each frame by 30 / diameter before inference, so diameter 80 runs at 37.5 %
# of native resolution, which shrinks small rounded mitotic nuclei; `diameter: null`
# with `min_size: 300` keeps them, at the cost of more false positives, and has not been
# validated for tracking.
models:
  nuclei:
    pretrained_model: cpsam_v2      # cellpose 4: cpsam_v2, cpsam, cpdino, cpdino-vitb, or a path
    channels: [nuclei_prediction]   # projected-plate channel name(s), at most 3
    eval_args:
      diameter: 80
      cellprob_threshold: 0.0
      flow_threshold: 0.4
      min_size: 2500                # px at native resolution
