# biahub segment: cellpose 4 nuclei labels from the virtual-stain nuclei channel of the
# PROJECTED plate (<N>-assemble/<dataset>_proj.zarr, Z=1; mantis v2, 0.1133 um/px). Segment
# does not project: a model without eval_args.do_3D segments in 2D and needs a Z=1
# input, which `biahub project` (project.yml) makes from the assembled plate.
# Not wired into mantis-v2.nf yet.
models:
  nuclei:
    pretrained_model: cpsam_v2      # cellpose 4: cpsam_v2, cpsam, cpdino, cpdino-vitb, or a path
    channels: [nuclei_prediction]   # projected-plate channel name(s), at most 3
    eval_args:
      diameter: null                # native resolution (cellpose 4 resizes by 30 / diameter)
      cellprob_threshold: 0.0
      flow_threshold: 0.4
      min_size: 300                 # px; small mitotic nuclei are ~300-2500 px
