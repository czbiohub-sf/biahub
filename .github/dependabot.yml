version: 2
updates:
  # GitHub Actions only — keeps the SHA pins fresh. The Python side is covered
  # by Dependabot security updates plus the weekly uv-lock workflow, so a
  # per-package uv ecosystem here would only add noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps):"
    # One PR bumping every action, rather than one PR per action.
    groups:
      actions:
        patterns:
          - "*"
