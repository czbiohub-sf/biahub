name: uv lock refresh

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  relock:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch holding the refreshed uv.lock
      pull-requests: write # open/update the refresh PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      # Bumps every dependency the pyproject constraints allow, in one commit,
      # instead of one Dependabot PR per package.
      - name: Upgrade the lockfile
        run: uv lock --upgrade

      # Opens (or force-updates) a single long-lived PR. Note that a PR created
      # with GITHUB_TOKEN does not trigger the other workflows — close and
      # reopen it, or push an empty commit, to run CI against the new lockfile.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: uv.lock
          branch: deps/uv-lock-refresh
          delete-branch: true
          commit-message: "build(deps): refresh uv.lock"
          title: "build(deps): weekly uv.lock refresh"
          body: |
            Automated `uv lock --upgrade`. Review the version bumps, then close
            and reopen this PR to run CI against the refreshed lockfile.
          labels: dependencies
